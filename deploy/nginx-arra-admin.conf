# ── ARRA ADMIN — nginx (VPS LWS) ─────────────────────────────────────────────
# NOUVEAU fichier : ne remplace ni ne modifie le bloc « arra-rh » existant.
#
# Installation :
#   sudo cp nginx-arra-admin.conf /etc/nginx/sites-available/arra-admin
#   sudo ln -s /etc/nginx/sites-available/arra-admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis HTTPS (certbot ajoute lui-même la section SSL À CE BLOC uniquement) :
#   sudo certbot --nginx -d admin.arra-engineering.com
#
# ⚠️ Ne PAS toucher à /etc/nginx/sites-enabled/arra-rh.

server {
    listen 80;
    server_name admin.arra-engineering.com;

    # Téléversements : plafond applicatif à 10 Mo, on laisse un peu de marge.
    client_max_body_size 15m;

    # ── API FastAPI (conteneur arra-admin, port 8011) ──
    # Doit être déclaré AVANT « location / » pour avoir la priorité.
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Génération PDF (WeasyPrint) et réponses du chatbot peuvent être longues
        proxy_read_timeout 300s;
    }

    # ── Documentation interactive de l'API ──
    location /docs {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
    }

    # ── Frontend Next.js (conteneur arra-admin, port 8010) ──
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
